[package]
name = "cuescript"
version = "0.1.0"
edition = "2021"
description = "authoring language for player-facing surfaces in the terrorify stack"
license = "MIT"

[dependencies]
thiserror = "1"
smallvec = "1"
# regex-lite, not regex: patterns here are small username/format checks that
# run once per button press, never per tick, and this crate is compiled to wasm
# for the panel where the full engine costs ~1MB of download for no benefit
regex-lite = "0.1"
